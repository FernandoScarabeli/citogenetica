version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    # O projeto fica em Spring Boot 3; springdoc 3 exige Spring Boot 4.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - version-update:semver-major
      - dependency-name: "org.springdoc:*"
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/web
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /apps/api
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    # O projeto fica em Java 17. A imagem maven traz o Java na tag e o
    # Dependabot trata a troca de Java como atualização pequena, então não dá
    # para filtrar só os saltos: ela é atualizada à mão.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types:
          - version-update:semver-major
      - dependency-name: "maven"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /apps/web
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
