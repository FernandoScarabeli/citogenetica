worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    # Mantém a porta enviada pelo navegador no cabeçalho Host após o mapeamento do Docker.
    map $http_host $forwarded_port {
        default $server_port;
        ~*:(?<host_port>[0-9]+)$ $host_port;
    }

    # Cache longo somente para os arquivos do Vite com nome versionado por hash.
    # Na API vale o que ela mesma responder (a foto de perfil pode ficar em cache; o resto, não).
    map $uri $cache_control {
        default "no-cache";
        "~^/api/" "";
        "~^/assets/.+-[A-Za-z0-9_-]{8,}[.][^/]+$" "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # Restringe somente enquadramento; não impõe regras de carregamento que possam quebrar o app.
        add_header Content-Security-Policy "frame-ancestors 'none';" always;
        add_header Cache-Control $cache_control always;

        location = /index.html {
            try_files $uri =404;
        }

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ^~ /api/events/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_connect_timeout 5s;
            proxy_read_timeout 31m;
            proxy_send_timeout 31m;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
        }

        location ^~ /api/ {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            # Fotos: até 10 MB no arquivo (lâmina), com folga para o resto do formulário.
            client_max_body_size 11m;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
