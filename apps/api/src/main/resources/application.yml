server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: ${API_SECURITY_SESSION_TIMEOUT:30m}
      cookie:
        name: CITOGENETICA_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

spring:
  application:
    name: citogenetica-api

  session:
    timeout: ${API_SECURITY_SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never

  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT}/${SPRING_DATASOURCE_DATABASE}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Sem Open Session In View: a conexão JDBC volta ao pool ao fim da transação, e não ao fim
    # da requisição. Com ele ligado, cada stream SSE aberto prendia uma conexão até fechar.
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

api:
  cors:
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS}
  security:
    trusted-proxy:
      internal-proxies: ${API_SECURITY_TRUSTED_PROXY_REGEX:}
    token:
      recovery-expiration-minutes: ${API_SECURITY_TOKEN_RECOVERY_EXPIRATION_MINUTES:15}
    recovery:
      hmac-secret: ${API_SECURITY_RECOVERY_HMAC_SECRET}
      max-attempts: ${API_SECURITY_RECOVERY_MAX_ATTEMPTS:5}
      email-executor-core-size: ${API_SECURITY_RECOVERY_EMAIL_EXECUTOR_CORE_SIZE:1}
      email-executor-max-size: ${API_SECURITY_RECOVERY_EMAIL_EXECUTOR_MAX_SIZE:2}
      email-executor-queue-capacity: ${API_SECURITY_RECOVERY_EMAIL_EXECUTOR_QUEUE_CAPACITY:50}
    rate-limit:
      window-minutes: ${API_SECURITY_RATE_LIMIT_WINDOW_MINUTES:15}
      cleanup-interval-ms: ${API_SECURITY_RATE_LIMIT_CLEANUP_INTERVAL_MS:3600000}
      login:
        ip: ${API_SECURITY_RATE_LIMIT_LOGIN_IP:60}
        email: ${API_SECURITY_RATE_LIMIT_LOGIN_EMAIL:10}
      recovery-request:
        ip: ${API_SECURITY_RATE_LIMIT_RECOVERY_REQUEST_IP:30}
        email: ${API_SECURITY_RATE_LIMIT_RECOVERY_REQUEST_EMAIL:3}
      validate:
        ip: ${API_SECURITY_RATE_LIMIT_VALIDATE_IP:30}
        email: ${API_SECURITY_RATE_LIMIT_VALIDATE_EMAIL:10}
      reset:
        ip: ${API_SECURITY_RATE_LIMIT_RESET_IP:30}
        email: ${API_SECURITY_RATE_LIMIT_RESET_EMAIL:10}
  sse:
    max-connections-per-user: ${API_SSE_MAX_CONNECTIONS_PER_USER:5}
    timeout: ${API_SSE_TIMEOUT:30m}
  frontend:
    url: ${API_FRONTEND_URL}
  email:
    from: ${API_EMAIL_FROM}

app:
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD}
  email:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    auth: ${SPRING_MAIL_AUTH}
    starttls-enable: ${SPRING_MAIL_STARTTLS_ENABLE}

storage:
  internal-endpoint: ${STORAGE_INTERNAL_ENDPOINT:http://localhost:9000}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
  region: ${STORAGE_REGION:us-east-1}
  path-style: ${STORAGE_PATH_STYLE:true}
  bucket: ${STORAGE_BUCKET:citogenetica}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  presigned-url-validity-seconds: ${STORAGE_PRESIGNED_URL_VALIDITY_SECONDS:900}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
